name: CI

# Runs the whole verification story documented in README.md's "Building and testing this repo":
# plain `swift test` (RichTextCore, cross-platform, plus RichTextEditor's macOS half — both real
# AppKit here, no simulator needed), an iOS Simulator destination for RichTextEditor's iOS half,
# the example app's own multiplatform build, and the web package's own test/typecheck.
#
# Requires a macOS runner whose *host OS* is 26, not just an Xcode version whose SDKs cover it —
# this package's deployment floor is iOS 26 / macOS 26 (see docs/ROADMAP.md's Decided section for
# why that isn't being lowered), and macOS-26-only runtime symbols (e.g. SwiftUI's
# `GlassEffectContainer`) fail to dynamically link on an older host even when Xcode itself
# supports the newer SDK. `runs-on: macos-15` was tried first and failed on exactly this — 9/9 CI
# runs red, `xcodebuild: error: ... doesn't support My Mac's macOS 15.7.9` and a `dlopen` failure
# on `GlassEffectContainer`. `macos-26` is now a published GitHub-hosted runner image
# (`actions/runner-images`) and is the minimum this workflow supports — there is no macOS-15
# fallback path, matching the product's own floor. `xcode-version: "26.6.0"` is pinned, not a
# placeholder — confirmed via a real green run (all four jobs) on 2026-09-16, run 35093888255.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  swift-test:
    name: swift test (RichTextCore + macOS RichTextEditor)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6.0"
      - run: swift test

  ios-simulator:
    name: xcodebuild test (iOS half of RichTextEditor)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6.0"
      - name: Select a booted-capable iOS Simulator destination
        run: |
          DEVICE=$(xcrun simctl list devices available iOS | grep -m1 "iPhone" | sed -E 's/^[[:space:]]*([^(]+) \(([-A-F0-9]+)\).*/\2/')
          if [ -z "$DEVICE" ]; then
            echo "::error::No available iOS Simulator device found (xcrun simctl list devices available iOS returned nothing matching 'iPhone')."
            xcrun simctl list devices available iOS
            exit 1
          fi
          echo "Resolved iOS Simulator device: $DEVICE"
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - run: |
          xcodebuild test -scheme RichTextCrossPlatform-Package \
            -destination "id=$SIMULATOR_ID"

  example-app:
    name: Example app builds (macOS + iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6.0"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Regenerate the example app's Xcode project
        working-directory: examples/rich-text-editor-demo
        run: xcodegen generate
      - name: Build for macOS
        # CODE_SIGNING_ALLOWED=NO is a command-line override for this headless CI runner, which
        # has no Apple Developer Team configured — it must NOT be baked into project.yml itself
        # (that was tried, and forces a permanently unsigned binary that a real device then
        # refuses to install, regardless of the team a real developer later selects in Xcode).
        working-directory: examples/rich-text-editor-demo
        run: |
          xcodebuild build -project RichTextEditorDemo.xcodeproj \
            -scheme RichTextEditorDemo -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
      - name: Select a booted-capable iOS Simulator destination
        run: |
          DEVICE=$(xcrun simctl list devices available iOS | grep -m1 "iPhone" | sed -E 's/^[[:space:]]*([^(]+) \(([-A-F0-9]+)\).*/\2/')
          if [ -z "$DEVICE" ]; then
            echo "::error::No available iOS Simulator device found (xcrun simctl list devices available iOS returned nothing matching 'iPhone')."
            xcrun simctl list devices available iOS
            exit 1
          fi
          echo "Resolved iOS Simulator device: $DEVICE"
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Build for iOS Simulator
        working-directory: examples/rich-text-editor-demo
        run: |
          xcodebuild build -project RichTextEditorDemo.xcodeproj \
            -scheme RichTextEditorDemo -destination "id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO

  web:
    name: Web package (npm test + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/packages/rich-text-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test -- --run
      - run: npx tsc --noEmit
