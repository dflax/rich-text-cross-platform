name: RichTextEditorDemo
options:
  bundleIdPrefix: com.richtextcrossplatform.demo
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  RichTextCrossPlatform:
    path: ../..
targets:
  RichTextEditorDemo:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: RichTextEditorDemo
    dependencies:
      - package: RichTextCrossPlatform
        product: RichTextCore
      - package: RichTextCrossPlatform
        product: RichTextEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.richtextcrossplatform.demo.RichTextEditorDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: true
        TARGETED_DEVICE_FAMILY: "1,2"
        # Automatic signing, no team hardcoded here — pick your own team in Xcode's Signing &
        # Capabilities tab (a free personal-team Apple ID is enough for a device you own). Do
        # NOT set CODE_SIGNING_ALLOWED/CODE_SIGNING_REQUIRED to false here even for local
        # Simulator/Mac testing with no team selected: that setting forces a completely unsigned
        # binary regardless of what team is picked afterward, which builds and runs fine on
        # Simulator/"My Mac" but a real device refuses to install outright ("The executable is
        # not codesigned") — confirmed the hard way. For a headless/CI build with no team
        # available, pass CODE_SIGNING_ALLOWED=NO as an xcodebuild command-line override instead
        # of baking it into this shared project file.
        CODE_SIGN_STYLE: Automatic

